[package]
name = "nanofix"
description = "Low-latency FIX protocol engine: zero-copy parser, serializer, sessions and TCP transport"
readme = "../../README.md"
keywords = ["fix", "trading", "finance", "protocol", "low-latency"]
categories = ["network-programming", "finance", "parser-implementations", "encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
dpdk = []

[dependencies]
memmap2 = "0.9"
crossbeam-utils = "0.8"
hdrhistogram = "7.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1.4"
quickcheck = "1.0"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "parse_benchmark"
harness = false

[[bench]]
name = "serialize_benchmark"
harness = false

[[bench]]
name = "throughput_benchmark"
harness = false

[[bench]]
name = "session_benchmark"
harness = false
