[workspace]
members = ["crates/nanofix", "crates/nanofix-sbe", "crates/nanofix-aeron"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Matt Hartley"]
repository = "https://github.com/matthart1983/nanofix"
homepage = "https://github.com/matthart1983/nanofix"

[workspace.dependencies]
nanofix = { path = "crates/nanofix", version = "0.1.0" }
nanofix-sbe = { path = "crates/nanofix-sbe", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
